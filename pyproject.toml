[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localmapbench"
version = "0.2.0"
description = "Matched nested cross-validation benchmarking of feature maps for local regression"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Hoa Dinh Nguyen", email = "hoand@ptit.edu.vn" },
]
keywords = [
  "local regression",
  "nested cross-validation",
  "feature preprocessing",
  "Monte Carlo",
  "benchmarking",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]
plot = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/dinhhoaptit/localmapbench"
Issues = "https://github.com/dinhhoaptit/localmapbench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
